backend:
  name: github
  repo: paolocirillo/Portfolio
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "gallery"
        label: "Gestione Foto"
        file: "data/photos.json"
        fields:
          - name: "groups"
            label: "Raccolte per Anno"
            label_singular: "Anno"
            widget: "list"
            required: false
            summary: "Anno {{fields.year}}"
            fields:
              - label: "Anno"
                name: "year"
                widget: "string"
                default: "2026"
              - label: "Foto"
                name: "images"
                widget: "image"
                multiple: true
                required: false
